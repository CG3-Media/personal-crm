<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Personal CRM - Solar View</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #0d0d1a 100%);
      min-height: 100vh;
      overflow: hidden;
      color: white;
    }
    
    #solar-system {
      width: 100vw;
      height: 100vh;
      cursor: grab;
    }
    #solar-system:active { cursor: grabbing; }
    
    .nav {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 12px;
      z-index: 100;
    }
    .nav a, .nav button {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav a:hover, .nav button:hover {
      background: rgba(255,255,255,0.2);
    }
    
    .stats {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.5);
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 13px;
      z-index: 100;
    }
    .stats h2 { font-size: 18px; margin-bottom: 8px; }
    .stats .stat { opacity: 0.7; margin: 4px 0; }
    
    .legend {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(0,0,0,0.5);
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 12px;
      z-index: 100;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
    }
    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    
    .tooltip {
      position: fixed;
      background: rgba(0,0,0,0.9);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 200;
      max-width: 250px;
    }
    .tooltip.visible { opacity: 1; }
    .tooltip h3 { font-size: 15px; margin-bottom: 6px; }
    .tooltip p { opacity: 0.7; margin: 3px 0; font-size: 12px; }
    
    .sun {
      fill: #ffd700;
      filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8));
    }
    
    .orbit {
      fill: none;
      stroke: rgba(255,255,255,0.1);
      stroke-dasharray: 4 4;
    }
    
    .planet {
      cursor: pointer;
      transition: transform 0.2s;
    }
    .planet:hover {
      filter: brightness(1.3);
    }
    
    .moon {
      cursor: pointer;
    }
    
    .label {
      fill: white;
      font-size: 11px;
      text-anchor: middle;
      pointer-events: none;
    }
    
    /* Detail Panel */
    .detail-panel {
      position: fixed;
      top: 0;
      right: -400px;
      width: 400px;
      height: 100vh;
      background: rgba(20, 20, 35, 0.98);
      border-left: 1px solid rgba(255,255,255,0.1);
      padding: 24px;
      overflow-y: auto;
      transition: right 0.3s ease;
      z-index: 150;
    }
    .detail-panel.open { right: 0; }
    .detail-panel h2 { font-size: 24px; margin-bottom: 4px; }
    .detail-panel .subtitle { opacity: 0.6; margin-bottom: 20px; }
    .detail-panel .close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      opacity: 0.6;
    }
    .detail-panel .close:hover { opacity: 1; }
    .detail-section { margin: 20px 0; }
    .detail-section h4 { 
      font-size: 11px; 
      text-transform: uppercase; 
      opacity: 0.5; 
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .detail-section p, .detail-section li { 
      font-size: 14px; 
      margin: 6px 0;
      opacity: 0.9;
    }
    .detail-section ul { list-style: none; }
    .tag {
      display: inline-block;
      background: rgba(255,255,255,0.1);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      margin: 2px;
    }
    .action-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      margin: 4px;
    }
    .action-btn:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <div class="nav">
    <a href="/list.html">📋 List View</a>
    <button onclick="showAddModal()">+ Add Person</button>
  </div>
  
  <div class="stats">
    <h2>☀️ Your Universe</h2>
    <div class="stat"><span id="stat-people">0</span> people in orbit</div>
    <div class="stat"><span id="stat-stale">0</span> drifting away (30+ days)</div>
  </div>
  
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background: #64b5f6"></div> Friend</div>
    <div class="legend-item"><div class="legend-dot" style="background: #81c784"></div> Colleague</div>
    <div class="legend-item"><div class="legend-dot" style="background: #ba68c8"></div> Family</div>
    <div class="legend-item"><div class="legend-dot" style="background: #ffb74d"></div> Other</div>
    <div class="legend-item" style="margin-top: 12px; opacity: 0.6">
      <span>← closer = recent contact</span>
    </div>
  </div>
  
  <div class="tooltip" id="tooltip"></div>
  
  <svg id="solar-system"></svg>
  
  <div class="detail-panel" id="detail-panel">
    <button class="close" onclick="closePanel()">×</button>
    <div id="detail-content"></div>
  </div>
  
  <!-- Add Modal -->
  <div id="add-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:300; align-items:center; justify-content:center;">
    <div style="background:#1a1a2e; border-radius:12px; padding:24px; width:90%; max-width:400px; max-height:80vh; overflow-y:auto;">
      <h3 style="margin-bottom:16px;">Add Person</h3>
      <form id="add-form">
        <input type="text" id="add-first-name" placeholder="First Name *" required style="width:100%; padding:10px; margin:6px 0; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); border-radius:6px; color:white;">
        <input type="text" id="add-last-name" placeholder="Last Name" style="width:100%; padding:10px; margin:6px 0; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); border-radius:6px; color:white;">
        <input type="text" id="add-relationship" placeholder="Relationship (friend, colleague...)" style="width:100%; padding:10px; margin:6px 0; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); border-radius:6px; color:white;">
        <input type="text" id="add-company" placeholder="Company" style="width:100%; padding:10px; margin:6px 0; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); border-radius:6px; color:white;">
        <input type="text" id="add-location" placeholder="Location" style="width:100%; padding:10px; margin:6px 0; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); border-radius:6px; color:white;">
        <input type="date" id="add-birthday" placeholder="Birthday" style="width:100%; padding:10px; margin:6px 0; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); border-radius:6px; color:white;">
        <div style="display:flex; gap:8px; margin-top:16px;">
          <button type="button" onclick="closeAddModal()" style="flex:1; padding:10px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); border-radius:6px; color:white; cursor:pointer;">Cancel</button>
          <button type="submit" style="flex:1; padding:10px; background:#4a9eff; border:none; border-radius:6px; color:white; cursor:pointer;">Add</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API = '';
    let people = [];
    let resetZoomFn = null;
    let simulation;
    
    const colors = {
      friend: '#64b5f6',
      colleague: '#81c784',
      family: '#ba68c8',
      default: '#ffb74d'
    };
    
    function getColor(relationship) {
      if (!relationship) return colors.default;
      const r = relationship.toLowerCase();
      if (r.includes('friend')) return colors.friend;
      if (r.includes('colleague') || r.includes('work') || r.includes('coworker')) return colors.colleague;
      if (r.includes('family') || r.includes('brother') || r.includes('sister') || r.includes('parent') || r.includes('cousin')) return colors.family;
      return colors.default;
    }
    
    function getName(p) {
      return p.full_name || [p.first_name, p.last_name].filter(Boolean).join(' ');
    }
    
    function daysSince(dateStr) {
      if (!dateStr) return 999;
      const date = new Date(dateStr);
      const now = new Date();
      return Math.floor((now - date) / (1000 * 60 * 60 * 24));
    }
    
    function getLastContact(p) {
      // Find most recent interaction or meeting date
      const dates = [];
      if (p.interactions) p.interactions.forEach(i => dates.push(i.date));
      if (p.meetings) p.meetings.forEach(m => dates.push(m.meeting_date));
      if (dates.length === 0) return null;
      return dates.sort().reverse()[0];
    }
    
    async function loadData() {
      // Fetch all people with their details
      const list = await fetch(`${API}/api/people`).then(r => r.json());
      
      // Fetch details for each to get interactions/meetings
      let allPeople = await Promise.all(list.map(async p => {
        const details = await fetch(`${API}/api/people/${p.id}`).then(r => r.json());
        return {
          ...details,
          lastContact: getLastContact(details),
          daysSinceContact: daysSince(getLastContact(details))
        };
      }));
      
      // Filter out colleagues and manually hidden people
      people = allPeople.filter(p => {
        const rel = (p.relationship || '').toLowerCase();
        if (rel.includes('colleague')) return false;
        if (p.hidden_from_solar) return false;
        return true;
      });
      
      // Apply relationship gravity - connected people inherit proximity
      applyRelationshipGravity();
      
      // Get stale count
      const stale = people.filter(p => p.daysSinceContact >= 30).length;
      document.getElementById('stat-people').textContent = people.length;
      document.getElementById('stat-stale').textContent = stale;
      
      renderSolarSystem();
    }
    
    function applyRelationshipGravity() {
      // For each person, check if they're connected to someone closer
      // If so, pull them closer (weighted average)
      people.forEach(person => {
        // Check reverse relations (e.g., Jameela is Marlin's spouse)
        if (person.reverseRelations && person.reverseRelations.length > 0) {
          person.reverseRelations.forEach(rel => {
            const connected = people.find(p => p.id === rel.from_id);
            if (connected && connected.daysSinceContact < person.daysSinceContact) {
              // Pull closer - spouses nearly match, others get partial pull
              if (rel.relation_type === 'spouse') {
                // Spouse gets pulled to nearly same orbit (just slightly further)
                person.daysSinceContact = connected.daysSinceContact + 2;
              } else {
                // Others get 30% pull toward connected person
                person.daysSinceContact = Math.round(
                  person.daysSinceContact * 0.7 + connected.daysSinceContact * 0.3
                );
              }
              person.inheritedProximity = true;
            }
          });
        }
        
        // Also check direct relations
        if (person.relations && person.relations.length > 0) {
          person.relations.forEach(rel => {
            if (rel.related_person_id) {
              const connected = people.find(p => p.id === rel.related_person_id);
              if (connected && connected.daysSinceContact < person.daysSinceContact) {
                if (rel.relation_type === 'spouse') {
                person.daysSinceContact = connected.daysSinceContact + 2;
              } else {
                person.daysSinceContact = Math.round(
                  person.daysSinceContact * 0.7 + connected.daysSinceContact * 0.3
                );
              }
                person.inheritedProximity = true;
              }
            }
          });
        }
      });
    }
    
    function renderSolarSystem() {
      const svg = d3.select('#solar-system');
      svg.selectAll('*').remove();
      
      const width = window.innerWidth;
      const height = window.innerHeight;
      const centerX = width / 2;
      const centerY = height / 2;
      
      svg.attr('width', width).attr('height', height);
      
      // Create zoom behavior
      const zoom = d3.zoom()
        .scaleExtent([0.3, 3])
        .on('zoom', (event) => {
          g.attr('transform', event.transform);
        });
      svg.call(zoom);
      
      // Function to zoom and center on a point
      function zoomToNode(x, y) {
        const scale = 1.8;
        const transform = d3.zoomIdentity
          .translate(centerX, centerY)
          .scale(scale)
          .translate(-x, -y);
        svg.transition()
          .duration(500)
          .call(zoom.transform, transform);
      }
      
      // Reset zoom
      function resetZoom() {
        svg.transition()
          .duration(500)
          .call(zoom.transform, d3.zoomIdentity.translate(centerX, centerY));
      }
      resetZoomFn = resetZoom;
      
      const g = svg.append('g')
        .attr('transform', `translate(${centerX}, ${centerY})`);
      
      // Orbit rings - 4 tiers: 2 weeks, 1 month, 90 days, beyond
      const maxOrbit = Math.min(width, height) * 0.4;
      const orbitRadii = [0.25, 0.5, 0.75, 0.95].map(r => r * maxOrbit);
      
      orbitRadii.forEach(r => {
        g.append('circle')
          .attr('class', 'orbit')
          .attr('cx', 0)
          .attr('cy', 0)
          .attr('r', r);
      });
      
      // Sun (you)
      g.append('circle')
        .attr('class', 'sun')
        .attr('cx', 0)
        .attr('cy', 0)
        .attr('r', 30);
      
      g.append('text')
        .attr('x', 0)
        .attr('y', 50)
        .attr('text-anchor', 'middle')
        .attr('fill', 'rgba(255,255,255,0.6)')
        .attr('font-size', '12px')
        .text('You');
      
      // Calculate positions for people
      const nodes = people.map((p, i) => {
        // Distance based on days since contact - more spread out
        let distance;
        const rel = (p.relationship || '').toLowerCase();
        
        // Max radius to keep everyone on screen
        const maxOrbit = Math.min(width, height) * 0.4;
        
        // Wife is always locked closest
        if (rel === 'wife' || rel === 'husband' || rel === 'spouse') {
          distance = 50;
        } else {
          const days = p.daysSinceContact;
          // 4 rings: <2 weeks, <1 month, <90 days, >90 days
          if (days <= 14) distance = maxOrbit * 0.25;
          else if (days <= 30) distance = maxOrbit * 0.5;
          else if (days <= 90) distance = maxOrbit * 0.75;
          else distance = maxOrbit * 0.95;
        }
        // Add small random offset to prevent perfect overlap
        distance += (Math.random() - 0.5) * 25;
        
        // Angle - spread evenly with less randomness for cleaner look
        const angle = (i / people.length) * 2 * Math.PI + (Math.random() - 0.5) * 0.3;
        
        // Size based on relationship and direct contact
        const isSpouse = rel === 'wife' || rel === 'husband' || rel === 'spouse';
        const hasDirectContact = p.interactions?.length > 0 || p.meetings?.length > 0;
        const radius = isSpouse ? 18 : (hasDirectContact ? 14 : (p.inheritedProximity ? 8 : 10));
        
        return {
          ...p,
          x: Math.cos(angle) * distance,
          y: Math.sin(angle) * distance,
          radius,
          color: getColor(p.relationship)
        };
      });
      
      // Draw planets
      const planets = g.selectAll('.planet')
        .data(nodes)
        .enter()
        .append('g')
        .attr('class', 'planet')
        .attr('transform', d => `translate(${d.x}, ${d.y})`)
        .on('mouseover', showTooltip)
        .on('mouseout', hideTooltip)
        .on('click', (event, d) => {
          zoomToNode(d.x, d.y);
          showDetail(d);
        });
      
      planets.append('circle')
        .attr('r', d => d.radius)
        .attr('fill', d => d.color)
        .attr('filter', d => `drop-shadow(0 0 8px ${d.color})`);
      
      planets.append('text')
        .attr('class', 'label')
        .attr('y', d => d.radius + 14)
        .text(d => getName(d).split(' ')[0]);
      
      // Draw moons (relations)
      nodes.forEach(node => {
        if (!node.relations || node.relations.length === 0) return;
        
        const planetG = g.selectAll('.planet')
          .filter(d => d.id === node.id);
        
        node.relations.forEach((rel, i) => {
          const moonAngle = (i / node.relations.length) * 2 * Math.PI;
          const moonDist = 35;
          const moonX = Math.cos(moonAngle) * moonDist;
          const moonY = Math.sin(moonAngle) * moonDist;
          
          const moon = planetG.append('g')
            .attr('class', 'moon')
            .attr('transform', `translate(${moonX}, ${moonY})`)
            .on('mouseover', (event) => {
              const tooltip = document.getElementById('tooltip');
              tooltip.innerHTML = `<h3>${rel.linked_name || rel.name}</h3><p>${rel.relation_type}</p>`;
              tooltip.style.left = event.pageX + 10 + 'px';
              tooltip.style.top = event.pageY + 10 + 'px';
              tooltip.classList.add('visible');
            })
            .on('mouseout', hideTooltip)
            .on('click', (event) => {
              event.stopPropagation();
              if (rel.related_person_id || rel.linked_id) {
                const linked = people.find(p => p.id === (rel.related_person_id || rel.linked_id));
                if (linked) showDetail(linked);
              }
            });
          
          moon.append('circle')
            .attr('r', 6)
            .attr('fill', '#888');
        });
      });
      
      // Animate slow rotation
      let angle = 0;
      function animate() {
        angle += 0.0003;
        g.selectAll('.planet')
          .attr('transform', (d, i) => {
            const nodeAngle = Math.atan2(d.y, d.x) + angle * (1 - i * 0.02);
            const dist = Math.sqrt(d.x * d.x + d.y * d.y);
            const x = Math.cos(nodeAngle) * dist;
            const y = Math.sin(nodeAngle) * dist;
            return `translate(${x}, ${y})`;
          });
        requestAnimationFrame(animate);
      }
      animate();
    }
    
    function showTooltip(event, d) {
      const tooltip = document.getElementById('tooltip');
      const name = getName(d);
      const lastContact = d.lastContact ? `Last contact: ${d.lastContact}` : 'No interactions logged';
      const relationship = d.relationship || '';
      const company = d.company ? `@ ${d.company}` : '';
      
      tooltip.innerHTML = `
        <h3>${name}</h3>
        <p>${relationship} ${company}</p>
        <p>${lastContact}</p>
        ${d.daysSinceContact >= 30 ? '<p style="color: #ff6b6b">⚠️ Drifting away!</p>' : ''}
      `;
      tooltip.style.left = event.pageX + 10 + 'px';
      tooltip.style.top = event.pageY + 10 + 'px';
      tooltip.classList.add('visible');
    }
    
    function hideTooltip() {
      document.getElementById('tooltip').classList.remove('visible');
    }
    
    async function showDetail(person) {
      const data = await fetch(`${API}/api/people/${person.id}`).then(r => r.json());
      const name = getName(data);
      
      let html = `
        <h2>${name}</h2>
        <p class="subtitle">${data.relationship || ''} ${data.company ? '@ ' + data.company : ''}</p>
      `;
      
      // Basic info
      if (data.location || data.birthday || data.how_we_met) {
        html += `<div class="detail-section">
          <h4>Info</h4>
          ${data.location ? `<p>📍 ${data.location}</p>` : ''}
          ${data.birthday ? `<p>🎂 ${new Date(data.birthday).toLocaleDateString('en-US', {month: 'long', day: 'numeric'})}</p>` : ''}
          ${data.how_we_met ? `<p>🤝 ${data.how_we_met}</p>` : ''}
        </div>`;
      }
      
      // Relations
      if (data.relations && data.relations.length > 0) {
        html += `<div class="detail-section">
          <h4>Family & Relations</h4>
          <ul>
            ${data.relations.map(r => `<li>${r.relation_type}: ${r.linked_name || r.name}${r.age ? ` (${r.age})` : ''}</li>`).join('')}
          </ul>
        </div>`;
      }
      
      // Recent notes
      if (data.notes && data.notes.length > 0) {
        html += `<div class="detail-section">
          <h4>Recent Notes</h4>
          <ul>
            ${data.notes.slice(0, 3).map(n => `<li>${n.note} <span style="opacity:0.5">(${n.date})</span></li>`).join('')}
          </ul>
        </div>`;
      }
      
      // Meetings
      if (data.meetings && data.meetings.length > 0) {
        html += `<div class="detail-section">
          <h4>Meetings</h4>
          <ul>
            ${data.meetings.slice(0, 3).map(m => `<li><strong>${m.title}</strong> - ${m.meeting_date}${m.summary ? '<br>' + m.summary : ''}</li>`).join('')}
          </ul>
        </div>`;
      }
      
      // Actions
      html += `<div class="detail-section">
        <h4>Actions</h4>
        <button class="action-btn" onclick="logInteraction(${data.id})">+ Log Interaction</button>
        <button class="action-btn" onclick="addNote(${data.id})">+ Add Note</button>
        <a href="/list.html" class="action-btn" style="text-decoration:none; display:inline-block;">Edit in List</a>
        <button class="action-btn" onclick="hideFromSolar(${data.id})" style="opacity:0.6">Hide from Solar</button>
      </div>`;
      
      document.getElementById('detail-content').innerHTML = html;
      document.getElementById('detail-panel').classList.add('open');
    }
    
    function closePanel() {
      document.getElementById('detail-panel').classList.remove('open');
      if (resetZoomFn) resetZoomFn();
    }
    
    async function logInteraction(personId) {
      const type = prompt('Interaction type (coffee, call, dinner, drinks):');
      if (!type) return;
      const notes = prompt('Notes (optional):');
      await fetch(`${API}/api/people/${personId}/interactions`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ interaction_type: type, notes })
      });
      loadData();
      closePanel();
    }
    
    async function hideFromSolar(personId) {
      await fetch(`${API}/api/people/${personId}/toggle-solar`, { method: 'POST' });
      closePanel();
      loadData();
    }
    
    async function addNote(personId) {
      const note = prompt('Note:');
      if (!note) return;
      await fetch(`${API}/api/people/${personId}/notes`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ note })
      });
      loadData();
    }
    
    function showAddModal() {
      document.getElementById('add-modal').style.display = 'flex';
    }
    
    function closeAddModal() {
      document.getElementById('add-modal').style.display = 'none';
    }
    
    document.getElementById('add-form').onsubmit = async (e) => {
      e.preventDefault();
      const data = {
        first_name: document.getElementById('add-first-name').value,
        last_name: document.getElementById('add-last-name').value,
        relationship: document.getElementById('add-relationship').value,
        company: document.getElementById('add-company').value,
        location: document.getElementById('add-location').value,
        birthday: document.getElementById('add-birthday').value
      };
      await fetch(`${API}/api/people`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });
      closeAddModal();
      document.getElementById('add-form').reset();
      loadData();
    };
    
    window.addEventListener('resize', renderSolarSystem);
    loadData();
  </script>
</body>
</html>
